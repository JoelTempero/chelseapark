<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://www.chelseapark.co.nz/wp-content/uploads/sites/454/2023/12/cropped-CP-Favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chelsea Park Motor Lodge - A friendly 4 star motor lodge located in the heart of Nelson City, NZ. Great rates and pet friendly rooms available." />
    <title>Chelsea Park Motor Lodge | Nelson, NZ</title>
    <!-- Handle SPA redirects from 404.html -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
